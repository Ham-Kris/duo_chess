<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duo Chess</title>
  <link rel="icon" href="assets/pieces/white-knight.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20261007-3">
</head>
<body>
  <main class="game-shell">
    <section class="game-content">
      <h1>Duo Chess</h1>
      <div class="board-wrap">
        <div class="board-surface">
          <div class="board" id="board" role="grid" aria-label="国际象棋棋盘"></div>
          <svg id="boardOverlay" class="board-overlay" viewBox="0 0 800 800"></svg>
        </div>
      </div>

      <div class="controls" aria-label="对局控制">
        <div class="status" id="status">白方回合</div>
      </div>
    </section>
    <aside class="side-panel" aria-label="对局设置">
      <h2>对局设置</h2>
      <button id="customSetup" class="text-button setup-entry" type="button">自定义棋局</button>
      <section id="setupEditor" class="setup-editor" aria-label="编辑棋局" hidden>
        <p class="setup-hint">选择棋子后点击格子放置；使用移动工具调整位置。</p>
        <div id="piecePalette" class="piece-palette" aria-label="选择摆放棋子"></div>
        <div class="setup-actions">
          <button id="movePiece" class="text-button" type="button" aria-pressed="true">移动</button>
          <button id="erasePiece" class="text-button" type="button" aria-pressed="false">删除</button>
          <button id="clearSetup" class="text-button" type="button">清空棋盘</button>
          <button id="standardSetup" class="text-button" type="button">标准摆法</button>
        </div>
        <label class="field-label" for="setupTurn">谁先手</label>
        <select id="setupTurn" class="text-input"><option value="w">白方先手</option><option value="b">黑方先手</option></select>
        <p class="setup-hint">额外的后、车、象、马共用升变额度，每少一个兵可多放一个。自定义开局无王车易位和吃过路兵权。</p>
        <div id="setupMessage" class="setup-message" role="status" aria-live="polite"></div>
        <div class="setup-actions">
          <button id="startSetup" class="text-button" type="button">开始对局</button>
          <button id="cancelSetup" class="text-button" type="button">取消编辑</button>
        </div>
      </section>
      <button id="standardGame" class="text-button setup-entry" type="button" hidden>标准新局</button>
      <div class="history-controls" aria-label="棋步历史">
        <button id="undoMove" class="icon-button" type="button" aria-label="撤销一步" title="撤销一步" disabled>
          <svg class="history-icon" viewBox="0 0 1170 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M811.008 271.945143H147.675429l198.656-198.509714A43.154286 43.154286 0 0 0 285.257143 12.653714L12.653714 285.037714a43.008 43.008 0 0 0 0 60.928l272.749715 272.310857a43.154286 43.154286 0 0 0 61.074285-60.928L150.308571 361.764571h660.553143a269.458286 269.458286 0 1 1 0 538.916572H226.962286a44.982857 44.982857 0 1 0 0 89.965714h583.899428c198.509714 0 359.424-160.914286 359.424-359.424a359.277714 359.277714 0 0 0-359.277714-359.277714z"/>
          </svg>
        </button>
        <button id="redoMove" class="icon-button" type="button" aria-label="重做一步" title="重做一步" disabled>
          <svg class="history-icon history-icon--redo" viewBox="0 0 1170 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M811.008 271.945143H147.675429l198.656-198.509714A43.154286 43.154286 0 0 0 285.257143 12.653714L12.653714 285.037714a43.008 43.008 0 0 0 0 60.928l272.749715 272.310857a43.154286 43.154286 0 0 0 61.074285-60.928L150.308571 361.764571h660.553143a269.458286 269.458286 0 1 1 0 538.916572H226.962286a44.982857 44.982857 0 1 0 0 89.965714h583.899428c198.509714 0 359.424-160.914286 359.424-359.424a359.277714 359.277714 0 0 0-359.277714-359.277714z"/>
          </svg>
        </button>
      </div>
      <button id="reset" class="text-button reset-button" type="button">重新开始</button>
      <button id="flipView" class="text-button flip-button" type="button">反转视角</button>
      <label class="toggle-row attack-toggle"><span class="white-attack-label">白方攻击线</span><input id="whiteAttacks" type="checkbox" checked></label>
      <label class="toggle-row attack-toggle"><span class="black-attack-label">黑方攻击线</span><input id="blackAttacks" type="checkbox" checked></label>
      <section class="assistance" aria-labelledby="assistanceTitle">
        <h3 id="assistanceTitle">AI 辅助对局</h3>
        <div id="suggestions" aria-live="polite"></div>
        <div class="win-rate" id="winRate" title="引擎概率估计；强制将死按最佳应对计算，普通局面即使估计为百分百也不保证实际结果" aria-live="polite">胜率估计：暂无概率</div>
        <button id="retryAnalysis" class="text-button" type="button" hidden>重试分析</button>
        <label class="toggle-row draw-toggle" title="当视角一方轮到行棋且胜率低于 20%、负率高于胜率时，优先寻找和棋线路"><span id="preferDrawLabel">白方劣势时优先争取和棋</span><input id="preferDraw" type="checkbox"></label>
      </section>
      <section class="account-settings" aria-labelledby="accountTitle">
        <h3 id="accountTitle">访问保护</h3>
        <form id="accountSetup" hidden>
          <label class="field-label" for="accountUsername">账号</label>
          <input id="accountUsername" class="text-input" type="text" maxlength="64" autocomplete="username">
          <label class="field-label" for="accountPassword">密码</label>
          <input id="accountPassword" class="text-input" type="password" minlength="8" maxlength="256" autocomplete="new-password">
          <button id="saveAccount" class="text-button account-button" type="submit">启用密码访问</button>
        </form>
        <div id="accountActive" hidden>
          <p class="account-summary">当前账号：<strong id="currentUsername"></strong></p>
          <button id="logout" class="text-button account-button" type="button">退出登录</button>
        </div>
        <div class="account-message" id="accountMessage" role="status"></div>
      </section>
    </aside>
  </main>
  <div id="promotionPopover" class="promotion-popover" popover="auto" aria-label="选择升变棋子">
    <div id="promotionChoices" class="promotion-choices"></div>
  </div>
  <script type="module" src="app.js?v=20261004-3"></script>
</body>
</html>
