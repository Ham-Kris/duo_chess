<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duo Chess</title>
  <link rel="icon" href="assets/pieces/white-knight.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <section class="game-content">
      <h1>Duo Chess</h1>
      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="国际象棋棋盘"></div>
      </div>

      <div class="controls" aria-label="对局控制">
        <div class="status" id="status">白方回合</div>
      </div>
    </section>
    <aside class="side-panel" aria-label="对局设置">
      <h2>对局设置</h2>
      <div class="history-controls" aria-label="棋步历史">
        <button id="undoMove" class="icon-button" type="button" aria-label="撤销一步" title="撤销一步" disabled>↶</button>
        <button id="redoMove" class="icon-button" type="button" aria-label="重做一步" title="重做一步" disabled>↷</button>
      </div>
      <button id="reset" class="text-button reset-button" type="button">重新开始</button>
      <label class="toggle-row">
        <span>自动翻转视角</span>
        <input id="autoFlip" type="checkbox">
      </label>
      <button id="flipView" class="text-button flip-button" type="button">反转视角</button>
      <fieldset class="mode-group">
        <legend>模式</legend>
        <label><input type="radio" name="gameMode" value="human" checked> 双人对局</label>
        <label><input type="radio" name="gameMode" value="ai-black"> AI 执黑</label>
        <label><input type="radio" name="gameMode" value="ai-white"> AI 执白</label>
      </fieldset>
      <div class="engine-status" id="aiStatus">双人对局</div>
      <section class="account-settings" aria-labelledby="accountTitle">
        <h3 id="accountTitle">访问保护</h3>
        <form id="accountSetup" hidden>
          <label class="field-label" for="accountUsername">账号</label>
          <input id="accountUsername" class="text-input" type="text" maxlength="64" autocomplete="username">
          <label class="field-label" for="accountPassword">密码</label>
          <input id="accountPassword" class="text-input" type="password" minlength="8" maxlength="256" autocomplete="new-password">
          <button id="saveAccount" class="text-button account-button" type="submit">启用密码访问</button>
        </form>
        <div id="accountActive" hidden>
          <p class="account-summary">当前账号：<strong id="currentUsername"></strong></p>
          <button id="logout" class="text-button account-button" type="button">退出登录</button>
        </div>
        <div class="account-message" id="accountMessage" role="status"></div>
      </section>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
